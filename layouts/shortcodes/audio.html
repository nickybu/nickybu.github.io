{{ $src := .Get "src" }}
{{ if findRE "drive.google.com" $src }}
  {{ $id := replaceRE ".*file/d/([^/]+).*" "$1" $src }}
  <iframe src="https://drive.google.com/file/d/{{ $id }}/preview" width="100%" height="140" allow="autoplay" style="border: none; border-radius: 8px;"></iframe>
{{ else }}
  <audio controls style="width: 100%;" src="{{ $src }}"></audio>
{{ end }}
