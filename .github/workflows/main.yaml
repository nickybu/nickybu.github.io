permissions:
  contents: write
  pages: write
  id-token: write

name: Build and Deploy Hugo Site to Pages

on:
  push:
    branches:
      - develop

defaults:
  run:
    shell: bash

# Allows you to run this workflow manually from the Actions tab
workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.99.0

    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_Linux-64bit.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb          
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v2
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./public
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1
        
    steps:
      # Checkout source repository including submodules using your PAT.
      - name: Checkout repository with PAT for submodules
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PUSH_TOKEN }}
          ref: develop
          submodules: recursive

      # Set up Python 3.10 and install dependencies.
      - name: Set up Python 3.10 environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install selenium

      # Run your scraper.
      - name: Run scraper script
        run: python scripts/scrape-goodreads-shelf.py

      # Update all submodules.
      - name: Update git submodules
        run: |
          git submodule update --init --recursive
          git submodule update --remote

      # Set up Hugo with version 0.142.0.
      - name: Set up Hugo environment
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.142.0'
          extended: true

      - name: Build site with Hugo
        run: hugo

      # Configure Git with a bot identity for committing.
      - name: Configure Git for submodule commits
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Update the remote URL for the public submodule to use your PAT.
      - name: Update submodule remote URL with PAT
        run: |
          cd public
          git remote set-url origin https://x-access-token:${{ secrets.PUSH_TOKEN }}@github.com/nickybu/nickybu.github.io.git

      - name: Checkout submodule branch
        run: |
          cd public
          git checkout develop || echo "Already on develop"

      # Stage and commit any changes in the public directory.
      - name: Commit changes in public submodule
        run: |
          cd public
          git add .
          git commit -m "Automated update via GitHub Actions" || echo "No changes to commit"

      # Push the committed changes using a fully qualified refspec.
      - name: Push changes to submodule repository
        run: |
          cd public
          git push origin HEAD:refs/heads/develop
